<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bigger Picture</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="learning.css"><link rel="stylesheet" href="v2.css"><style>[hidden]{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer;padding:10px 16px;border:1px solid #ccd4df;border-radius:7px;background:#455b75;color:white}input,select,textarea{padding:10px;border:1px solid #ccd4df;border-radius:7px;max-width:100%;color:#172333;background:white}form{display:grid;gap:12px;max-width:620px}#status{white-space:pre-wrap} .actions{display:flex;gap:8px;flex-wrap:wrap}.record{margin:12px 0;padding:16px;border:1px solid #e1e6ec;border-radius:9px}.hero__nav button{background:transparent;color:inherit;border:0}.record p{white-space:pre-wrap;overflow-wrap:anywhere}
:root{color-scheme:light;--bp-bg:#f5f7fa;--bp-surface:#fff;--bp-text:#243247;--bp-muted:#53647a;--bp-border:#dce3eb;--bp-accent:#455b75;--bp-button:#fff}
:root[data-theme="dark"]{color-scheme:dark;--bp-bg:#151c26;--bp-surface:#202b39;--bp-text:#e7edf5;--bp-muted:#b5c3d4;--bp-border:#415064;--bp-accent:#526d8e}
body,.learning-main,.intro{background:var(--bp-bg);color:var(--bp-text)}
.learning-main{width:min(1200px,100%);margin-inline:auto;padding:clamp(16px,4vw,48px);box-sizing:border-box}
#view{min-width:0}#view h2,#view h3,#view h4,.intro h2,.eyebrow.dark{color:var(--bp-text)}
#view p,#status{color:var(--bp-muted)}
#view .panel,#view .record,#view .stat,#view .tile,#login,#view details{background:var(--bp-surface);color:var(--bp-text);border-color:var(--bp-border);box-shadow:none}
#view .panel,#login{padding:clamp(14px,3vw,24px);border:1px solid var(--bp-border);border-radius:12px;margin-block:16px}
#view .record{border:1px solid var(--bp-border);border-radius:10px}
#view details{padding:12px;border-radius:8px}
button{background:var(--bp-accent);color:var(--bp-button);border-color:var(--bp-border);min-height:40px}
button:hover{filter:brightness(1.1)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7e9fc6;outline-offset:3px}
input,select,textarea{background:var(--bp-surface);color:var(--bp-text);border-color:var(--bp-border);box-sizing:border-box}
form label{display:grid;gap:6px;min-width:0}form label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px}form input:not([type=checkbox]):not([type=radio]),form textarea,form select{width:100%}
textarea{min-height:90px;resize:vertical}progress{width:100%;accent-color:var(--bp-accent)}
#view .stat-grid,#view .tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
#view .stat{padding:16px;border:1px solid var(--bp-border);border-radius:10px;display:grid;gap:6px}#view .stat strong{font-size:1.5rem}
.hero__nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}.hero__nav button{min-height:40px;padding:8px 10px}
#theme-toggle{margin-top:12px;background:transparent;border:1px solid currentColor;color:inherit}
#view:fullscreen{overflow:auto;background:var(--bp-bg);color:var(--bp-text);padding:24px}
:root[data-theme="dark"] .learning-footer{background:var(--bp-surface);color:var(--bp-muted)}
@media(max-width:600px){.learning-main{padding:12px}.hero__nav{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:8px}.hero__nav button{flex:none;white-space:nowrap}.hero__content{min-width:0;max-width:100%;box-sizing:border-box}#view .actions{gap:6px}#view .actions button{padding:8px 12px;min-height:44px}#view .panel{padding:12px}#view .record{overflow-wrap:anywhere}#view img{max-width:100%}#view{overflow-x:auto}}
</style></head><body><header class="hero learning-hero"><div class="hero__content"><p class="eyebrow">MY PERSONAL HUB</p><h1>The Bigger Picture</h1><button type="button" id="theme-toggle" aria-pressed="false">Dark mode</button><nav class="hero__nav" id="nav" hidden aria-label="Main navigation"></nav></div></header><main class="learning-main"><section class="intro"><p class="eyebrow dark">MY PERSONAL HUB</p><h2>Build a life you're excited to live.</h2><p id="status" role="status">Connecting to Firebase…</p><section id="login" class="panel" hidden><h3>Sign in to your private hub</h3><button id="google">Continue with Google</button><form id="emailForm"><label>Email <input name="email" type="email" required autocomplete="email"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><div class="actions"><button>Sign in</button><button type="button" id="register">Create account</button><button type="button" id="reset">Reset password</button></div></form></section><div id="app" hidden><div class="actions"><button id="logout">Sign out</button><button id="export">Export my data</button></div><section id="view"></section></div></section></main><footer class="learning-footer">The Bigger Picture · My Personal Hub</footer><script>(()=>{const root=document.documentElement,b=document.getElementById('theme-toggle');let saved;try{saved=localStorage.getItem('bp-theme')}catch{}function apply(t){root.dataset.theme=t;b.textContent=t==='dark'?'Light mode':'Dark mode';b.setAttribute('aria-pressed',String(t==='dark'))}apply(saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');b.onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';apply(t);try{localStorage.setItem('bp-theme',t)}catch{}}})();</script><script type="module" src="app.js"></script></body></html>
